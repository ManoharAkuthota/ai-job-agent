spring.application.name=ai-job-agent
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/job_portal_agent?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Manu@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Uploads & Generated Resumes Directory
agent.storage.resume-dir=resumes_generated

# Agent AI and Daily Automation Defaults
agent.gemini.api-key=${GEMINI_API_KEY:}
# Cron expression: Runs every morning at 09:00 AM (Sec Min Hour Day Month Weekday)
agent.daily-cron=0 0 9 * * ?
agent.min-match-score=60
agent.target-domain=Java Full Stack
agent.target-keywords=Java, Spring Boot, React, MySQL, REST API
