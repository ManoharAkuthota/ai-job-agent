spring.application.name=ai-job-agent
server.port=${PORT:8080}
server.address=0.0.0.0

# TiDB Cloud Serverless MySQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/test?useSSL=true&verifyServerCertificate=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:3HVUhdVZBhSBCPs.root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:6BP74bdgTlFpWzrm}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Uploads & Generated Resumes Directory
agent.storage.resume-dir=resumes_generated

# Agent AI and Daily Automation Defaults
agent.gemini.api-key=${GEMINI_API_KEY:}
# Cron expression: Runs every morning at 09:00 AM (Sec Min Hour Day Month Weekday)
agent.daily-cron=0 0 9 * * ?
agent.min-match-score=60
agent.target-domain=Java Full Stack
agent.target-keywords=Java, Spring Boot, React, MySQL, REST API

# HikariCP Cloud Optimization for TiDB Serverless
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=30000

# Multipart File Upload Limits for Resumes
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server Error Reporting
server.error.include-message=always
server.error.include-binding-errors=always
