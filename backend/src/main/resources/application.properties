# TiDB Cloud Serverless MySQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/test?useSSL=true&verifyServerCertificate=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:3HVUhdVZBhSBCPs.root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:6BP74bdgTlFpWzrm}
